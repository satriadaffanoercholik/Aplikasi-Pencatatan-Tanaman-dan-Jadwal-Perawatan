<div class="d-flex">
  <div class="sidebar p-3">
    <h4>Menu</h4>
    
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" href="#dashboard">
          Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="#data-master">
          Data Master
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#transaksi">
          Transaksi
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="#laporan">
          Laporan
        </a>
      </li>

    </ul>
  </div>
  <div class="container mt-4">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <h3><b>Data Tanaman</b></h3>
          </div>
          <div class="card-body">
            <p>Data tanaman digunakan untuk mengetahui semua jenis, nama tanaman, dan tanggal ditanamnya tanaman tersebut</p>
          </div>
          <!-- Tombol atas -->
    <div class="mb-3 d-flex gap-2">
      <button id="btnTambah" class="btn btn-outline-dark btn-sm">[+ Tambah Data]</button>
      <button class="btn btn-outline-dark btn-sm" data-bs-toggle="collapse" data-bs-target="#panelFilter">[Filter]</button>
    </div>

    <!-- Panel Filter (muncul saat tombol Filter diklik) -->
    <div class="collapse mb-3" id="panelFilter">
      <div class="card bg-secondary-subtle border-secondary">
        <div class="card-body row g-2 align-items-center">
          <div class="col-sm-5">
            <input type="text" id="filterNama" class="form-control form-control-sm" placeholder="Cari nama tanaman...">
          </div>
          <div class="col-sm-4">
            <select id="filterJenis" class="form-select form-select-sm"></select>
          </div>
          <div class="col-sm-3">
            <button id="btnReset" class="btn btn-outline-dark btn-sm w-100">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabel -->
    <table class="table table-bordered border-dark align-middle">
      <thead class="table-secondary">
        <tr>
          <th>ID</th>
          <th>Nama</th>
          <th>Jenis</th>
          <th>Tgl Tanam</th>
          <th class="text-center">Aksi</th>
        </tr>
      </thead>
      <tbody id="tabelBody"></tbody>
    </table>

  <!-- Modal Form Tanaman -->
  <div class="modal fade" id="modalForm" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content border-dark">
        <form id="formTanaman">
          <div class="modal-header">
            <h5 class="modal-title" id="judulForm">Form Tanaman (CRUD)</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="idTanaman">

            <div class="mb-3">
              <label for="nama" class="form-label">Nama:</label>
              <input type="text" id="nama" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="jenis" class="form-label">Jenis:</label>
              <select id="jenis" class="form-select" required></select>
            </div>
            <div class="mb-3">
              <label for="tgl" class="form-label">Tgl Tanam:</label>
              <input type="date" id="tgl" class="form-control" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-outline-dark">Simpan</button>
            <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Batal</button>
          </div>
        </form>
      </div>
    </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const JENIS = ['Sayuran', 'Buah', 'Bunga', 'Tanaman Hias', 'Herbal'];

    // Data awal (contoh)
    let dataTanaman = [
      { id: 1, nama: 'Cabai Rawit', jenis: 'Sayuran',      tgl: '2026-09-01' },
      { id: 2, nama: 'Mangga',      jenis: 'Buah',         tgl: '2026-08-15' },
      { id: 3, nama: 'Mawar',       jenis: 'Bunga',        tgl: '2026-09-20' },
    ];
    let idBerikutnya = 4;

    const tabelBody   = document.getElementById('tabelBody');
    const filterNama  = document.getElementById('filterNama');
    const filterJenis = document.getElementById('filterJenis');
    const form        = document.getElementById('formTanaman');
    const modal       = new bootstrap.Modal(document.getElementById('modalForm'));

    // Isi pilihan dropdown dari array JENIS
    filterJenis.innerHTML = '<option value="">Semua Jenis</option>' +
      JENIS.map(j => `<option value="${j}">${j}</option>`).join('');
    document.getElementById('jenis').innerHTML =
      '<option value="" disabled selected>-- Pilih jenis --</option>' +
      JENIS.map(j => `<option value="${j}">${j}</option>`).join('');

    // Cegah teks input terbaca sebagai kode HTML
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const formatTgl = t => new Date(t + 'T00:00:00').toLocaleDateString('id-ID',
      { day: '2-digit', month: 'short', year: 'numeric' });

    // READ: tampilkan data (sudah disaring filter)
    function tampilkan() {
      const kata  = filterNama.value.toLowerCase();
      const jenis = filterJenis.value;

      const hasil = dataTanaman.filter(d =>
        d.nama.toLowerCase().includes(kata) && (jenis === '' || d.jenis === jenis));

      if (hasil.length === 0) {
        tabelBody.innerHTML =
          '<tr><td colspan="5" class="text-center text-muted">Tidak ada data.</td></tr>';
        return;
      }

      tabelBody.innerHTML = hasil.map(d => `
        <tr>
          <td>${d.id}</td>
          <td>${esc(d.nama)}</td>
          <td>${esc(d.jenis)}</td>
          <td>${formatTgl(d.tgl)}</td>
          <td class="text-center">
            <a href="#" class="btn-edit text-decoration-none" data-id="${d.id}">Edit</a> |
            <a href="#" class="btn-hapus text-decoration-none text-danger" data-id="${d.id}">Hapus</a>
          </td>
        </tr>`).join('');
    }

    // Buka form: kosong untuk tambah, terisi untuk edit
    function bukaForm(data) {
      form.reset();
      document.getElementById('idTanaman').value = data ? data.id : '';
      document.getElementById('judulForm').textContent =
        data ? 'Edit Tanaman' : 'Tambah Tanaman';
      if (data) {
        document.getElementById('nama').value  = data.nama;
        document.getElementById('jenis').value = data.jenis;
        document.getElementById('tgl').value   = data.tgl;
      }
      modal.show();
    }

    // CREATE: tombol Tambah Data
    document.getElementById('btnTambah').addEventListener('click', () => bukaForm(null));

    // CREATE & UPDATE: tombol Simpan
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const id = document.getElementById('idTanaman').value;
      const baru = {
        nama:  document.getElementById('nama').value.trim(),
        jenis: document.getElementById('jenis').value,
        tgl:   document.getElementById('tgl').value,
      };

      if (id) {
        // UPDATE: ganti data dengan ID yang sama
        dataTanaman = dataTanaman.map(d => d.id == id ? { ...d, ...baru } : d);
      } else {
        // CREATE: tambah data dengan ID baru
        dataTanaman.push({ id: idBerikutnya++, ...baru });
      }

      modal.hide();
      tampilkan();
    });

    // Edit dan Hapus (event delegation karena barisnya dibuat lewat JS)
    tabelBody.addEventListener('click', function (e) {
      const edit  = e.target.closest('.btn-edit');
      const hapus = e.target.closest('.btn-hapus');

      if (edit) {
        e.preventDefault();
        bukaForm(dataTanaman.find(d => d.id == edit.dataset.id));
      }

      if (hapus) {
        e.preventDefault();
        const d = dataTanaman.find(d => d.id == hapus.dataset.id);
        // DELETE: minta konfirmasi dulu
        if (confirm(`Hapus tanaman "${d.nama}"?`)) {
          dataTanaman = dataTanaman.filter(x => x.id != d.id);
          tampilkan();
        }
      }
    });

    // Filter langsung bekerja saat mengetik / memilih
    filterNama.addEventListener('input', tampilkan);
    filterJenis.addEventListener('change', tampilkan);
    document.getElementById('btnReset').addEventListener('click', () => {
      filterNama.value = '';
      filterJenis.value = '';
      tampilkan();
    });

    tampilkan();
  </script> 
</body>
</html>

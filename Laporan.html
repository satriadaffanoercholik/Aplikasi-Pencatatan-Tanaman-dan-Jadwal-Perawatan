<div class="d-flex">
  <div class="sidebar p-3">
    <h4>Menu</h4>
    
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" href="#dashboard">
          Dashboard

      </li>
      <li class="nav-item">
        <a class="nav-link" href="#data-master">

      </li>
      <li class="nav-item">
        <a class="nav-link" href="#transaksi">

  <div class="container mt-4">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <h3>Laporan</h3>
          </div>
          <div class="card-body">
          </div>
          <!-- Panel Filter -->
    <div class="card bg-secondary-subtle border-secondary mb-3">
      <div class="card-body">
        <h6 class="mb-3">Filter Laporan</h6>
        <div class="row g-2 align-items-center">

          <div class="col-auto">
            <label for="periode" class="col-form-label-sm">Periode:</label>
          </div>
          <div class="col-auto">
            <select id="periode" class="form-select form-select-sm">
              <option value="bulan-ini" selected>Bulan Ini</option>
              <option value="bulan-lalu">Bulan Lalu</option>
              <option value="tahun-ini">Tahun Ini</option>
              <option value="semua">Semua</option>
            </select>
          </div>

          <div class="col-auto ms-2">
            <label for="kategori" class="col-form-label-sm">Kategori:</label>
          </div>
          <div class="col-auto">
            <select id="kategori" class="form-select form-select-sm">
              <option value="semua" selected>Semua</option>
              <option value="Pemupukan">Pemupukan</option>
              <option value="Penyiraman">Penyiraman</option>
              <option value="Pestisida">Pestisida</option>
              <option value="Peralatan">Peralatan</option>
            </select>
          </div>

          <div class="w-100"></div>

          <div class="col-auto">
            <label for="lokasi" class="col-form-label-sm">Lokasi:</label>
          </div>
          <div class="col-auto">
            <select id="lokasi" class="form-select form-select-sm">
              <option value="semua">Semua</option>
              <option value="Kebun Depan" selected>Kebun Depan</option>
              <option value="Kebun Belakang">Kebun Belakang</option>
              <option value="Greenhouse">Greenhouse</option>
            </select>
          </div>

          <div class="col-auto">
            <button id="btnAplikasikan" class="btn btn-outline-dark btn-sm">Aplikasikan</button>
          </div>

        </div>
      </div>
    </div>

    <!-- Tabel Laporan -->
    <table class="table table-bordered border-dark align-middle mb-0">
      <thead class="table-secondary">
        <tr>
          <th>Keterangan</th>
          <th>Kategori</th>
          <th>Lokasi</th>
          <th class="text-center">Terlaksana</th>
          <th class="text-center">Tidak Terlaksana</th>
        </tr>
      </thead>
      <tbody id="tabelBody"></tbody>
    </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Helper tanggal: offsetBulan 0 = bulan ini, -1 = bulan lalu, dst.
    const tgl = (offsetBulan, hari) => {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth() + offsetBulan, hari);
    };

    // Data contoh: terlaksana = true / false
    const dataLaporan = [
      { ket: 'Pemberian pupuk kompos',  kat: 'Pemupukan',  lok: 'Kebun Depan',    terlaksana: true,  tanggal: tgl(0, 1) },
      { ket: 'Penyemprotan pestisida',  kat: 'Pestisida',  lok: 'Kebun Depan',    terlaksana: false, tanggal: tgl(0, 1) },
      { ket: 'Servis pompa air',        kat: 'Peralatan',  lok: 'Kebun Depan',    terlaksana: true,  tanggal: tgl(0, 1) },
      { ket: 'Pemasangan selang',       kat: 'Penyiraman', lok: 'Kebun Belakang', terlaksana: true,  tanggal: tgl(0, 1) },
      { ket: 'Pemberian pupuk cair',    kat: 'Pemupukan',  lok: 'Greenhouse',     terlaksana: false, tanggal: tgl(-1, 15) },
      { ket: 'Pemasangan sprinkler',    kat: 'Peralatan',  lok: 'Kebun Depan',    terlaksana: true,  tanggal: tgl(-1, 15) },
      { ket: 'Pemberian pupuk NPK',     kat: 'Pemupukan',  lok: 'Kebun Belakang', terlaksana: false, tanggal: tgl(-3, 10) },
    ];

    const periodeEl  = document.getElementById('periode');
    const kategoriEl = document.getElementById('kategori');
    const lokasiEl   = document.getElementById('lokasi');
    const tabelBody  = document.getElementById('tabelBody');

    // Cek apakah tanggal masuk periode yang dipilih
    function cocokPeriode(tanggal, periode) {
      const now = new Date();
      if (periode === 'semua') return true;
      if (periode === 'tahun-ini') return tanggal.getFullYear() === now.getFullYear();

      const target = periode === 'bulan-ini' ? tgl(0, 1) : tgl(-1, 1);
      return tanggal.getFullYear() === target.getFullYear() &&
             tanggal.getMonth() === target.getMonth();
    }

    function tampilkanLaporan() {
      const periode  = periodeEl.value;
      const kategori = kategoriEl.value;
      const lokasi   = lokasiEl.value;

      const hasil = dataLaporan.filter(d =>
        cocokPeriode(d.tanggal, periode) &&
        (kategori === 'semua' || d.kat === kategori) &&
        (lokasi === 'semua' || d.lok === lokasi)
      );

      let isi = '';

      if (hasil.length === 0) {
        isi = '<tr><td colspan="5" class="text-center text-muted">Tidak ada data untuk filter ini.</td></tr>';
      }

      hasil.forEach(d => {
        isi += `
          <tr>
            <td>${d.ket}</td>
            <td>${d.kat}</td>
            <td>${d.lok}</td>
            <td class="text-center text-success fw-bold">${d.terlaksana ? '✓' : ''}</td>
            <td class="text-center text-danger fw-bold">${d.terlaksana ? '' : '✓'}</td>
          </tr>`;
      });

      tabelBody.innerHTML = isi;
    }

    // Filter diterapkan saat tombol Aplikasikan diklik
    document.getElementById('btnAplikasikan').addEventListener('click', tampilkanLaporan);

    // Tampilkan data awal sesuai pilihan default
    tampilkanLaporan();
  </script>
</body>
</html>

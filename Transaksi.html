    <h1 class="page-title">Transaksi Perawatan</h1>
    <section class="panel mb-4">
      <div class="panel-heading">
        <span>＋ Catat Perawatan
        </span>
    </div>
      <div class="panel-body">
        <form id="activityForm">
          <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" 
                for="activityPlant">Nama Tanaman
                </label>
                <select class="form-select" 
                id="activityPlant" required>
            </select>
        </div>
            <div class="col-md-6">
                <label class="form-label" 
                for="activityCare">Jenis Perawatan
            </label>
            <select class="form-select" 
            id="activityCare" required>
        </select>
    </div>
            <div class="col-md-6">
                <label class="form-label" 
                for="activityDate">Tanggal Perawatan
                </label>
                <input class="form-control" id="activityDate" type="date" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" 
                for="activityNote">Keterangan
                </label>
                <textarea class="form-control" 
                id="activityNote" 
                rows="2" placeholder="Masukkan keterangan perawatan...">
            </textarea>
        </div>
            <div class="col-12">
                <button class="btn btn-success" 
                type="submit">Simpan Catatan
            </button>
        </div>
          </div>
        </form>
      </div>
    </section>
    <section class="panel" data-searchable-table>
      <div class="panel-heading">
        <span>Riwayat Perawatan
            </span>
            <span class="small-muted">Catatan terbaru ditampilkan lebih dahulu
            </span>
        </div>
      <div class="table-responsive">
        <table class="table table-bordered table-hover">
        <thead>
            <tr>
                <th>No
                </th>
                <th>Tanggal
                </th>
                <th>Nama Tanaman
                    </th>
                    <th>Perawatan</th>
                    <th>Keterangan</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="activityTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
